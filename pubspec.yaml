name: spotibai
description: Spotify-like offline music player with ZIP playlist import.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  just_audio: ^0.9.41
  audio_session: ^0.1.21
  file_picker: ^8.1.7
  archive: ^3.3.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.0
  path: ^1.6.4

 dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
