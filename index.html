<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Spotibai</title>
    <style>
      :root {
        --bg: #090909;
        --bg-2: #111113;
        --panel: #1a1a1d;
        --panel-2: #1d1d20;
        --panel-3: #2a2a2e;
        --text: #f5f5f5;
        --muted: #c7c7cb;
        --muted-2: #8a8a8d;
        --line: rgba(255,255,255,0.12);
        --green: #1ed760;
        --green-2: #18c65a;
        --green-soft: rgba(30,215,96,0.16);
        --white: #ffffff;
        --shadow: 0 16px 30px rgba(0,0,0,0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overscroll-behavior: none;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      button, input {
        font: inherit;
      }

      .phone-shell {
        width: 100%;
        max-width: 440px;
        min-height: 100vh;
        background: #0b0b0b;
        position: relative;
        overflow: hidden;
        border-left: 1px solid rgba(255,255,255,0.04);
        border-right: 1px solid rgba(255,255,255,0.04);
      }

      .statusbar {
        height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 18px 12px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f0f0f0;
      }

      .statusbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .statusbar-right {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
      }

      .signal {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        opacity: 0.9;
      }

      .signal-bars {
        display: inline-flex;
        align-items: end;
        gap: 2px;
        height: 14px;
      }

      .signal-bars span {
        width: 2px;
        border-radius: 2px;
        background: #f4f4f4;
        display: inline-block;
      }

      .signal-bars span:nth-child(1) { height: 4px; }
      .signal-bars span:nth-child(2) { height: 6px; }
      .signal-bars span:nth-child(3) { height: 8px; }
      .signal-bars span:nth-child(4) { height: 10px; }
      .signal-bars span:nth-child(5) { height: 12px; }

      .battery-wrap {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .battery {
        width: 22px;
        height: 11px;
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.8);
        position: relative;
      }

      .battery::after {
        content: "";
        position: absolute;
        width: 2px;
        height: 5px;
        background: rgba(255,255,255,0.8);
        right: -4px;
        top: 2px;
        border-radius: 2px;
      }

      .battery::before {
        content: "";
        position: absolute;
        inset: 1px 1px 1px 1px;
        border-radius: 2px;
        background: linear-gradient(90deg, #f7f7f7 100%, #f7f7f7 100%);
      }

      .browser-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px 12px;
      }

      .browser-pill {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin-right: 10px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 999px;
        padding: 12px 14px;
        height: 46px;
      }

      .browser-home {
        width: 20px;
        height: 20px;
        position: relative;
        border-radius: 5px;
        border: 2px solid rgba(255,255,255,0.9);
      }

      .browser-home::before {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border-left: 2px solid rgba(255,255,255,0.9);
        border-top: 2px solid rgba(255,255,255,0.9);
        transform: rotate(45deg);
        left: 3px;
        top: 2px;
      }

      .browser-url {
        flex: 1;
        color: rgba(255,255,255,0.95);
        font-size: 20px;
        letter-spacing: -0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .browser-search {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.8);
        position: relative;
      }

      .browser-search::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        border: 3px solid rgba(255,255,255,0.9);
        border-radius: 50%;
        top: 8px;
        left: 8px;
      }

      .browser-search::after {
        content: "";
        position: absolute;
        width: 9px;
        height: 3px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
        right: 9px;
        bottom: 9px;
        transform: rotate(45deg);
      }

      .browser-more {
        width: 22px;
        height: 22px;
        position: relative;
      }

      .browser-more::before,
      .browser-more::after,
      .browser-more span {
        content: "";
        position: absolute;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        transform: translateX(-50%);
      }

      .browser-more::before { top: 0; }
      .browser-more span { top: 8px; }
      .browser-more::after { top: 16px; }

      .app-frame {
        background: #0a0a0a;
        border-top: 1px solid rgba(255,255,255,0.1);
        min-height: calc(100vh - 138px);
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 20px 24px;
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--green);
        position: relative;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
      }

      .logo::before,
      .logo::after,
      .logo span {
        content: "";
        position: absolute;
        bottom: 7px;
        width: 5px;
        border-radius: 999px;
        background: rgba(0,0,0,0.9);
      }

      .logo::before { left: 6px; height: 12px; }
      .logo span { left: 12px; height: 16px; }
      .logo::after { left: 18px; height: 20px; }
      .logo .bar-last { left: 24px; height: 14px; }

      .brand-name {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 1;
      }

      .gear {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.75);
        position: relative;
      }

      .gear::before,
      .gear::after {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.75);
      }

      .gear::after {
        inset: 11px;
        border-width: 1px;
      }

      .library-panel {
        padding: 0 20px;
      }

      .section-title {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 1.1;
        margin: 4px 0 22px;
      }

      .upload-btn {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        width: 100%;
        height: 70px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 16px;
        padding: 0 18px;
        color: var(--text);
        font-size: 19px;
        font-weight: 500;
        letter-spacing: -0.03em;
        cursor: pointer;
      }

      .upload-btn .plus {
        font-size: 36px;
        line-height: 1;
        font-weight: 300;
      }

      .player-card {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 78px;
        border-top: 1px solid var(--line);
        background: rgba(10,10,10,0.96);
        padding: 18px 20px 0;
      }

      .mini-player {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding-bottom: 18px;
      }

      .mini-art {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: linear-gradient(135deg, #13b66b, #0d7c57);
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      }

      .mini-art .note {
        width: 24px;
        height: 24px;
        position: relative;
      }

      .mini-art .note::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 2px;
        width: 10px;
        height: 16px;
        border: 3px solid rgba(255,255,255,0.95);
        border-left-width: 0;
        border-radius: 0 10px 10px 0;
        transform: skewX(-18deg);
      }

      .mini-art .note::after {
        content: "";
        position: absolute;
        left: 0;
        top: 12px;
        width: 12px;
        height: 12px;
        border: 3px solid rgba(255,255,255,0.95);
        border-radius: 50%;
      }

      .mini-track {
        flex: 1;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.05em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .prev, .next, .play-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        cursor: pointer;
      }

      .prev::before, .next::before {
        content: "";
        position: absolute;
        width: 2px;
        height: 18px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
        transform: skewX(-16deg);
      }

      .prev::after, .next::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-top: 3px solid rgba(255,255,255,0.9);
        border-left: 3px solid rgba(255,255,255,0.9);
        top: 9px;
      }

      .prev::after {
        transform: rotate(-45deg);
        left: 10px;
      }

      .next::before {
        left: 12px;
      }

      .next::after {
        transform: rotate(135deg);
        right: 10px;
      }

      .play-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--white);
        box-shadow: 0 8px 16px rgba(255,255,255,0.08);
      }

      .play-btn::before {
        content: "";
        width: 0;
        height: 0;
        border-top: 10px solid transparent;
        border-left: 16px solid rgba(0,0,0,0.9);
        border-bottom: 10px solid transparent;
        margin-left: 4px;
      }

      .page-tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 78px;
        border-top: 1px solid var(--line);
        background: rgba(10,10,10,0.96);
      }

      .tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: rgba(255,255,255,0.76);
        background: transparent;
        border: none;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: -0.03em;
        cursor: pointer;
      }

      .tab.active {
        color: var(--text);
      }

      .tab-icon {
        width: 24px;
        height: 24px;
        position: relative;
        opacity: 0.9;
      }

      .tab-icon.library::before,
      .tab-icon.library::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: currentColor;
        border-radius: 3px;
      }

      .tab-icon.library::before { top: 5px; }
      .tab-icon.library::after { top: 12px; }
      .tab-icon.library span {
        position: absolute;
        top: 19px;
        left: 0;
        right: 0;
        height: 3px;
        background: currentColor;
        border-radius: 3px;
      }

      .tab-icon.player {
        border: 3px solid currentColor;
        border-radius: 5px;
        border-top-width: 2px;
      }

      .tab-icon.player::before {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border: 3px solid currentColor;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
      }

      .player-screen {
        padding: 18px 20px 0;
      }

      .player-art {
        width: 100%;
        aspect-ratio: 1.35;
        border-radius: 22px;
        background: linear-gradient(135deg, #16bf73, #0e7a5d 80%);
        display: grid;
        place-items: center;
        margin-top: 18px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .player-art .note {
        width: 130px;
        height: 130px;
        position: relative;
      }

      .player-art .note::before {
        content: "";
        position: absolute;
        width: 70px;
        height: 70px;
        left: 25px;
        top: 18px;
        border: 8px solid rgba(255,255,255,0.95);
        border-left: 0;
        border-radius: 0 45px 45px 0;
        transform: skewX(-18deg);
      }

      .player-art .note::after {
        content: "";
        position: absolute;
        width: 72px;
        height: 72px;
        left: 18px;
        top: 48px;
        border: 8px solid rgba(255,255,255,0.95);
        border-radius: 50%;
      }

      .player-title {
        text-align: center;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -0.065em;
        margin-top: 28px;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
      }

      .slider {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,0.25);
        outline: none;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
      }

      .time-text {
        font-size: 20px;
        color: rgba(255,255,255,0.7);
        min-width: 42px;
      }

      .player-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        margin-top: 24px;
        padding-bottom: 18px;
      }

      .control-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: rgba(255,255,255,0.9);
        position: relative;
      }

      .shuffle-icon::before,
      .shuffle-icon::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 10px;
        border: 2px solid currentColor;
        border-color: currentColor transparent currentColor currentColor;
        border-radius: 12px 12px 0 12px;
        transform: rotate(18deg);
      }

      .shuffle-icon::after {
        transform: rotate(198deg);
        left: 20px;
        top: 12px;
      }

      .prev-control,
      .next-control {
        width: 0;
        height: 0;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        position: relative;
      }

      .prev-control {
        border-right: 18px solid rgba(255,255,255,0.9);
        margin-right: 10px;
      }

      .prev-control::before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        border-right: 18px solid rgba(255,255,255,0.9);
        left: -22px;
      }

      .next-control {
        border-left: 18px solid rgba(255,255,255,0.9);
        margin-left: 10px;
      }

      .next-control::before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        border-left: 18px solid rgba(255,255,255,0.9);
        right: -22px;
      }

      .play-main {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: rgba(255,255,255,0.95);
        position: relative;
        box-shadow: 0 10px 28px rgba(255,255,255,0.08);
      }

      .play-main::before {
        content: "";
        position: absolute;
        left: 28px;
        top: 22px;
        width: 0;
        height: 0;
        border-top: 15px solid transparent;
        border-left: 24px solid rgba(0,0,0,0.92);
        border-bottom: 15px solid transparent;
      }

      .repeat-icon {
        position: relative;
        width: 24px;
        height: 24px;
      }

      .repeat-icon::before,
      .repeat-icon::after {
        content: "";
        position: absolute;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        width: 14px;
        height: 14px;
      }

      .repeat-icon::before {
        left: 3px;
        top: 5px;
        transform: rotate(-25deg);
      }

      .repeat-icon::after {
        right: 1px;
        top: 1px;
        transform: rotate(155deg);
      }

      @media (min-width: 600px) {
        .phone-shell {
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="statusbar">
        <div class="statusbar-left">5:20 AM</div>
        <div class="statusbar-right">
          <div class="signal"><div class="signal-bars"><span></span><span></span><span></span><span></span><span></span></div></div>
          <div style="font-size:10px; padding-left:4px;">N</div>
          <div style="font-size:10px;">5G</div>
          <div class="battery-wrap"><div class="battery"></div></div>
        </div>
      </div>

      <div class="browser-bar">
        <div class="browser-pill">
          <div class="browser-home" aria-hidden="true"></div>
          <div class="browser-url">app.base44.com/</div>
          <div class="browser-search" aria-hidden="true"></div>
        </div>
        <div class="browser-more" aria-hidden="true"><span></span></div>
      </div>

      <div class="app-frame">
        <div class="app-header">
          <div class="brand-wrap">
            <div class="logo" aria-label="Spotibai logo">
              <span></span>
              <div class="bar-last" style="position:absolute;left:24px;width:5px;height:14px;bottom:7px;border-radius:999px;background:rgba(0,0,0,0.9);"></div>
            </div>
            <div class="brand-name">Spotibai</div>
          </div>
          <div class="gear" aria-label="Settings"></div>
        </div>

        <div id="libraryView" class="view active">
          <div class="library-panel">
            <div class="section-title">Your Library</div>
            <button class="upload-btn" type="button">
              <span class="plus">＋</span>
              <span>Upload songs or zip</span>
            </button>
          </div>
        </div>

        <div id="playerView" class="view">
          <div class="player-screen">
            <div class="player-art">
              <div class="note"></div>
            </div>
            <div class="player-title">Nothing playing</div>
            <div class="slider-row">
              <span class="time-text">0:00</span>
              <input class="slider" type="range" value="0" />
              <span class="time-text">0:00</span>
            </div>

            <div class="player-controls">
              <div class="control-icon shuffle-icon" aria-label="Shuffle"></div>
              <div class="prev-control" aria-label="Previous"></div>
              <div class="play-main" aria-label="Play"></div>
              <div class="next-control" aria-label="Next"></div>
              <div class="repeat-icon" aria-label="Repeat"></div>
            </div>
          </div>
        </div>

        <div class="player-card" aria-label="Now playing summary">
          <div class="mini-player">
            <div class="mini-art"><div class="note"></div></div>
            <div class="mini-track">Nothing playing</div>
            <div class="controls">
              <button class="prev" type="button" aria-label="Previous track" style="width:32px;height:32px;"></button>
              <button class="play-btn" type="button" aria-label="Play" style="width:52px;height:52px;"></button>
              <button class="next" type="button" aria-label="Next track" style="width:32px;height:32px;"></button>
            </div>
          </div>
        </div>

        <div class="page-tabs">
          <button class="tab active" type="button" data-tab="library">
            <span class="tab-icon library"><span></span></span>
            <span>Library</span>
          </button>
          <button class="tab" type="button" data-tab="player">
            <span class="tab-icon player"></span>
            <span>Player</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      const tabs = document.querySelectorAll('.tab');
      const libraryView = document.getElementById('libraryView');
      const playerView = document.getElementById('playerView');

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          tabs.forEach((btn) => btn.classList.toggle('active', btn === tab));
          const isLibrary = tab.dataset.tab === 'library';
          libraryView.classList.toggle('active', isLibrary);
          playerView.classList.toggle('active', !isLibrary);
        });
      });
    </script>
  </body>
</html>
