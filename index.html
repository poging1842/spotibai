<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Spotibai</title>
    <style>
      :root {
        --bg: #090909;
        --panel: #101112;
        --panel-soft: rgba(255,255,255,0.06);
        --line: rgba(255,255,255,0.12);
        --text: #f5f5f5;
        --muted: rgba(255,255,255,0.74);
        --green: #1ed760;
        --green-deep: #0fae58;
        --track: rgba(255,255,255,0.24);
        --shadow: 0 20px 35px rgba(0,0,0,0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overscroll-behavior: none;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      button, input {
        font: inherit;
      }

      .phone-shell {
        width: 100%;
        max-width: 440px;
        min-height: 100vh;
        background: #0b0b0b;
        position: relative;
        overflow: hidden;
        border-left: 1px solid rgba(255,255,255,0.04);
        border-right: 1px solid rgba(255,255,255,0.04);
      }

      .statusbar {
        height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 18px 12px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f0f0f0;
      }

      .statusbar-right {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
      }

      .signal-bars {
        display: inline-flex;
        align-items: end;
        gap: 2px;
        height: 14px;
      }

      .signal-bars span {
        width: 2px;
        border-radius: 2px;
        background: #f4f4f4;
        display: inline-block;
      }

      .signal-bars span:nth-child(1) { height: 4px; }
      .signal-bars span:nth-child(2) { height: 6px; }
      .signal-bars span:nth-child(3) { height: 8px; }
      .signal-bars span:nth-child(4) { height: 10px; }
      .signal-bars span:nth-child(5) { height: 12px; }

      .battery {
        width: 22px;
        height: 11px;
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.8);
        position: relative;
      }

      .battery::after {
        content: "";
        position: absolute;
        width: 2px;
        height: 5px;
        background: rgba(255,255,255,0.8);
        right: -4px;
        top: 2px;
        border-radius: 2px;
      }

      .battery::before {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: 2px;
        background: linear-gradient(90deg, #f7f7f7 100%, #f7f7f7 100%);
      }

      .browser-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px 12px;
      }

      .browser-pill {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin-right: 10px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 999px;
        padding: 12px 14px;
        height: 46px;
      }

      .browser-home {
        width: 20px;
        height: 20px;
        position: relative;
        border-radius: 5px;
        border: 2px solid rgba(255,255,255,0.9);
      }

      .browser-home::before {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border-left: 2px solid rgba(255,255,255,0.9);
        border-top: 2px solid rgba(255,255,255,0.9);
        transform: rotate(45deg);
        left: 3px;
        top: 2px;
      }

      .browser-url {
        flex: 1;
        color: rgba(255,255,255,0.95);
        font-size: 20px;
        letter-spacing: -0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .browser-search {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.8);
        position: relative;
      }

      .browser-search::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        border: 3px solid rgba(255,255,255,0.9);
        border-radius: 50%;
        top: 8px;
        left: 8px;
      }

      .browser-search::after {
        content: "";
        position: absolute;
        width: 9px;
        height: 3px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
        right: 9px;
        bottom: 9px;
        transform: rotate(45deg);
      }

      .browser-more {
        width: 22px;
        height: 22px;
        position: relative;
      }

      .browser-more::before,
      .browser-more::after,
      .browser-more span {
        content: "";
        position: absolute;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        transform: translateX(-50%);
      }

      .browser-more::before { top: 0; }
      .browser-more span { top: 8px; }
      .browser-more::after { top: 16px; }

      .app-frame {
        background: #0a0a0a;
        border-top: 1px solid rgba(255,255,255,0.1);
        min-height: calc(100vh - 138px);
        position: relative;
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 20px 24px;
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--green);
        position: relative;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
      }

      .logo::before,
      .logo::after,
      .logo span {
        content: "";
        position: absolute;
        bottom: 7px;
        width: 5px;
        border-radius: 999px;
        background: rgba(0,0,0,0.9);
      }

      .logo::before { left: 6px; height: 12px; }
      .logo span { left: 12px; height: 16px; }
      .logo::after { left: 18px; height: 20px; }
      .bar-last {
        position: absolute;
        left: 24px;
        width: 5px;
        height: 14px;
        bottom: 7px;
        border-radius: 999px;
        background: rgba(0,0,0,0.9);
      }

      .brand-name {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 1;
      }

      .gear {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.75);
        position: relative;
      }

      .gear::before,
      .gear::after {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.75);
      }

      .gear::after {
        inset: 11px;
        border-width: 1px;
      }

      .library-panel {
        padding: 0 20px;
      }

      .section-title {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 1.1;
        margin: 4px 0 22px;
      }

      .upload-btn {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        width: 100%;
        min-height: 70px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 16px;
        padding: 0 18px;
        color: var(--text);
        font-size: 19px;
        font-weight: 500;
        letter-spacing: -0.03em;
        cursor: pointer;
      }

      .upload-btn .plus {
        font-size: 36px;
        line-height: 1;
        font-weight: 300;
      }

      .song-list {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .song-row {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 14px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }

      .song-thumb {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(30,215,96,.35), rgba(30,215,96,.12));
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--green);
      }

      .song-meta {
        min-width: 0;
        flex: 1;
      }

      .song-title {
        font-size: 17px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .song-sub {
        font-size: 12px;
        color: rgba(255,255,255,0.68);
      }

      .play-chip {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.02);
        position: relative;
      }

      .play-chip::before {
        content: "";
        position: absolute;
        left: 13px;
        top: 9px;
        border-top: 8px solid transparent;
        border-left: 12px solid rgba(255,255,255,0.9);
        border-bottom: 8px solid transparent;
      }

      .player-card {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 78px;
        border-top: 1px solid var(--line);
        background: rgba(10,10,10,0.96);
        padding: 18px 20px 0;
      }

      .mini-player {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding-bottom: 18px;
      }

      .mini-art {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: linear-gradient(135deg, #13b66b, #0d7c57);
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      }

      .note {
        width: 24px;
        height: 24px;
        position: relative;
      }

      .mini-art .note::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 2px;
        width: 10px;
        height: 16px;
        border: 3px solid rgba(255,255,255,0.95);
        border-left-width: 0;
        border-radius: 0 10px 10px 0;
        transform: skewX(-18deg);
      }

      .mini-art .note::after {
        content: "";
        position: absolute;
        left: 0;
        top: 12px;
        width: 12px;
        height: 12px;
        border: 3px solid rgba(255,255,255,0.95);
        border-radius: 50%;
      }

      .mini-track {
        flex: 1;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .prev, .next, .play-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        cursor: pointer;
      }

      .prev::before, .next::before {
        content: "";
        position: absolute;
        width: 2px;
        height: 18px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
        transform: skewX(-16deg);
      }

      .prev::after, .next::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-top: 3px solid rgba(255,255,255,0.9);
        border-left: 3px solid rgba(255,255,255,0.9);
        top: 9px;
      }

      .prev::after {
        transform: rotate(-45deg);
        left: 10px;
      }

      .next::before {
        left: 12px;
      }

      .next::after {
        transform: rotate(135deg);
        right: 10px;
      }

      .play-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--white);
        box-shadow: 0 8px 16px rgba(255,255,255,0.08);
      }

      .play-btn::before {
        content: "";
        width: 0;
        height: 0;
        border-top: 10px solid transparent;
        border-left: 16px solid rgba(0,0,0,0.9);
        border-bottom: 10px solid transparent;
        margin-left: 4px;
      }

      .play-btn.pause::before {
        width: 14px;
        height: 18px;
        border: none;
        background: rgba(0,0,0,0.9);
        box-shadow: 11px 0 0 rgba(0,0,0,0.9);
        margin-left: 0;
      }

      .page-tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 78px;
        border-top: 1px solid var(--line);
        background: rgba(10,10,10,0.96);
      }

      .tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: rgba(255,255,255,0.76);
        background: transparent;
        border: none;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: -0.03em;
        cursor: pointer;
      }

      .tab.active {
        color: var(--text);
      }

      .tab-icon {
        width: 24px;
        height: 24px;
        position: relative;
        opacity: 0.9;
      }

      .tab-icon.library::before,
      .tab-icon.library::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: currentColor;
        border-radius: 3px;
      }

      .tab-icon.library::before { top: 5px; }
      .tab-icon.library::after { top: 12px; }
      .tab-icon.library span {
        position: absolute;
        top: 19px;
        left: 0;
        right: 0;
        height: 3px;
        background: currentColor;
        border-radius: 3px;
      }

      .tab-icon.player {
        border: 3px solid currentColor;
        border-radius: 5px;
        border-top-width: 2px;
      }

      .tab-icon.player::before {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border: 3px solid currentColor;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
      }

      .player-screen {
        padding: 18px 20px 0;
      }

      .player-art {
        width: 100%;
        aspect-ratio: 1.35;
        border-radius: 22px;
        background: linear-gradient(135deg, #16bf73, #0e7a5d 80%);
        display: grid;
        place-items: center;
        margin-top: 18px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .player-art .note {
        width: 130px;
        height: 130px;
        position: relative;
      }

      .player-art .note::before {
        content: "";
        position: absolute;
        width: 70px;
        height: 70px;
        left: 25px;
        top: 18px;
        border: 8px solid rgba(255,255,255,0.95);
        border-left: 0;
        border-radius: 0 45px 45px 0;
        transform: skewX(-18deg);
      }

      .player-art .note::after {
        content: "";
        position: absolute;
        width: 72px;
        height: 72px;
        left: 18px;
        top: 48px;
        border: 8px solid rgba(255,255,255,0.95);
        border-radius: 50%;
      }

      .player-title {
        text-align: center;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -0.065em;
        margin-top: 28px;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
      }

      .slider {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,0.25);
        outline: none;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
      }

      .time-text {
        font-size: 20px;
        color: rgba(255,255,255,0.7);
        min-width: 42px;
      }

      .player-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        margin-top: 24px;
        padding-bottom: 18px;
      }

      .control-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: rgba(255,255,255,0.9);
        position: relative;
      }

      .shuffle-icon::before,
      .shuffle-icon::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 10px;
        border: 2px solid currentColor;
        border-color: currentColor transparent currentColor currentColor;
        border-radius: 12px 12px 0 12px;
        transform: rotate(18deg);
      }

      .shuffle-icon::after {
        transform: rotate(198deg);
        left: 20px;
        top: 12px;
      }

      .prev-control,
      .next-control {
        width: 0;
        height: 0;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        position: relative;
      }

      .prev-control {
        border-right: 18px solid rgba(255,255,255,0.9);
        margin-right: 10px;
      }

      .prev-control::before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        border-right: 18px solid rgba(255,255,255,0.9);
        left: -22px;
      }

      .next-control {
        border-left: 18px solid rgba(255,255,255,0.9);
        margin-left: 10px;
      }

      .next-control::before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        border-left: 18px solid rgba(255,255,255,0.9);
        right: -22px;
      }

      .play-main {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: rgba(255,255,255,0.95);
        position: relative;
        box-shadow: 0 10px 28px rgba(255,255,255,0.08);
      }

      .play-main::before {
        content: "";
        position: absolute;
        left: 28px;
        top: 22px;
        width: 0;
        height: 0;
        border-top: 15px solid transparent;
        border-left: 24px solid rgba(0,0,0,0.92);
        border-bottom: 15px solid transparent;
      }

      .play-main.pause::before {
        left: 24px;
        width: 10px;
        height: 28px;
        border: 0;
        background: rgba(0,0,0,0.92);
        box-shadow: 14px 0 0 rgba(0,0,0,0.92);
      }

      .repeat-icon {
        position: relative;
        width: 24px;
        height: 24px;
      }

      .repeat-icon::before,
      .repeat-icon::after {
        content: "";
        position: absolute;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        width: 14px;
        height: 14px;
      }

      .repeat-icon::before {
        left: 3px;
        top: 5px;
        transform: rotate(-25deg);
      }

      .repeat-icon::after {
        right: 1px;
        top: 1px;
        transform: rotate(155deg);
      }

      @media (max-width: 380px) {
        .mini-track { font-size: 16px; }
        .brand-name { font-size: 34px; }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="statusbar">
        <div>5:20 AM</div>
        <div class="statusbar-right">
          <div class="signal-bars"><span></span><span></span><span></span><span></span><span></span></div>
          <div style="font-size:10px; padding-left:4px;">N</div>
          <div style="font-size:10px;">5G</div>
          <div class="battery"></div>
        </div>
      </div>

      <div class="browser-bar">
        <div class="browser-pill">
          <div class="browser-home" aria-hidden="true"></div>
          <div class="browser-url">app.base44.com/</div>
          <div class="browser-search" aria-hidden="true"></div>
        </div>
        <div class="browser-more" aria-hidden="true"><span></span></div>
      </div>

      <div class="app-frame">
        <div class="app-header">
          <div class="brand-wrap">
            <div class="logo" aria-label="Spotibai logo">
              <span></span>
              <div class="bar-last"></div>
            </div>
            <div class="brand-name">Spotibai</div>
          </div>
          <div class="gear" aria-label="Settings"></div>
        </div>

        <div id="libraryView" class="view active">
          <div class="library-panel">
            <div class="section-title">Your Library</div>
            <label class="upload-btn" for="fileInput">
              <span class="plus">＋</span>
              <span>Upload songs or zip</span>
            </label>
            <input id="fileInput" type="file" accept=".zip,audio/*" multiple hidden />
            <div id="songList" class="song-list"></div>
          </div>
        </div>

        <div id="playerView" class="view">
          <div class="player-screen">
            <div class="player-art">
              <div class="note"></div>
            </div>
            <div id="playerTitle" class="player-title">Nothing playing</div>
            <div class="slider-row">
              <span id="currentTimeText" class="time-text">0:00</span>
              <input id="seekBar" class="slider" type="range" min="0" max="100" value="0" />
              <span id="durationText" class="time-text">0:00</span>
            </div>

            <div class="player-controls">
              <div class="control-icon shuffle-icon" aria-label="Shuffle"></div>
              <div class="prev-control" id="prevBtn" aria-label="Previous"></div>
              <div class="play-main" id="bigPlayBtn" aria-label="Play"></div>
              <div class="next-control" id="nextBtn" aria-label="Next"></div>
              <div class="repeat-icon" aria-label="Repeat"></div>
            </div>
          </div>
        </div>

        <div class="player-card" aria-label="Now playing summary">
          <div class="mini-player">
            <div class="mini-art"><div class="note"></div></div>
            <div id="miniTrackText" class="mini-track">Nothing playing</div>
            <div class="controls">
              <button class="prev" id="miniPrev" type="button" aria-label="Previous track" style="width:32px;height:32px;"></button>
              <button class="play-btn" id="miniPlayBtn" type="button" aria-label="Play" style="width:52px;height:52px;"></button>
              <button class="next" id="miniNext" type="button" aria-label="Next track" style="width:32px;height:32px;"></button>
            </div>
          </div>
        </div>

        <div class="page-tabs">
          <button class="tab active" type="button" data-tab="library">
            <span class="tab-icon library"><span></span></span>
            <span>Library</span>
          </button>
          <button class="tab" type="button" data-tab="player">
            <span class="tab-icon player"></span>
            <span>Player</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      const DB_NAME = 'spotibai-db';
      const STORE_NAME = 'songs';
      const audio = new Audio();
      const state = {
        songs: [],
        currentIndex: -1,
        playing: false,
        isShuffle: false,
        loop: false,
      };

      const tabs = document.querySelectorAll('.tab');
      const libraryView = document.getElementById('libraryView');
      const playerView = document.getElementById('playerView');
      const songListEl = document.getElementById('songList');
      const fileInput = document.getElementById('fileInput');
      const seekBar = document.getElementById('seekBar');
      const currentTimeText = document.getElementById('currentTimeText');
      const durationText = document.getElementById('durationText');
      const playerTitle = document.getElementById('playerTitle');
      const miniTrackText = document.getElementById('miniTrackText');
      const bigPlayBtn = document.getElementById('bigPlayBtn');
      const miniPlayBtn = document.getElementById('miniPlayBtn');

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          tabs.forEach((btn) => btn.classList.toggle('active', btn === tab));
          const showLibrary = tab.dataset.tab === 'library';
          libraryView.classList.toggle('active', showLibrary);
          playerView.classList.toggle('active', !showLibrary);
        });
      });

      document.getElementById('miniPrev').addEventListener('click', prevTrack);
      document.getElementById('miniNext').addEventListener('click', nextTrack);
      document.getElementById('prevBtn').addEventListener('click', prevTrack);
      document.getElementById('nextBtn').addEventListener('click', nextTrack);
      bigPlayBtn.addEventListener('click', togglePlayback);
      miniPlayBtn.addEventListener('click', togglePlayback);

      fileInput.addEventListener('change', handleFiles);
      seekBar.addEventListener('input', (event) => {
        if (!audio.duration) return;
        audio.currentTime = Number(event.target.value);
      });

      audio.addEventListener('timeupdate', () => {
        if (!Number.isFinite(audio.duration) || audio.duration === 0) return;
        const ratio = (audio.currentTime / audio.duration) * 100;
        seekBar.value = String(ratio);
        currentTimeText.textContent = formatTime(audio.currentTime);
      });

      audio.addEventListener('loadedmetadata', () => {
        durationText.textContent = formatTime(audio.duration || 0);
        seekBar.max = String(audio.duration || 100);
        seekBar.value = String(audio.currentTime || 0);
      });

      audio.addEventListener('ended', () => {
        if (state.loop) {
          audio.currentTime = 0;
          audio.play();
          return;
        }
        nextTrack();
      });

      audio.addEventListener('play', () => {
        state.playing = true;
        syncPlayButtonState();
      });

      audio.addEventListener('pause', () => {
        state.playing = false;
        syncPlayButtonState();
      });

      function syncPlayButtonState() {
        const playClass = state.playing ? 'pause' : '';
        bigPlayBtn.classList.toggle('pause', state.playing);
        miniPlayBtn.classList.toggle('pause', state.playing);
        bigPlayBtn.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
        miniPlayBtn.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
      }

      function formatTime(sec) {
        const safe = Number.isFinite(sec) ? sec : 0;
        const mins = Math.floor(safe / 60);
        const secs = Math.floor(safe % 60).toString().padStart(2, '0');
        return `${mins}:${secs}`;
      }

      function openDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('IndexedDB failed.'));
        });
      }

      async function saveSongs(records) {
        const db = await openDb();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        for (const record of records) {
          store.put(record);
        }
        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error || new Error('Could not save songs.'));
        });
      }

      async function loadSongs() {
        const db = await openDb();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error || new Error('Could not load songs.'));
        });
      }

      async function renderSongs() {
        state.songs = await loadSongs();
        songListEl.innerHTML = '';

        if (!state.songs.length) {
          songListEl.innerHTML = '<div class="song-sub" style="padding:12px 0;">No tracks yet. Upload a song or ZIP to begin.</div>';
          return;
        }

        state.songs.forEach((song, index) => {
          const row = document.createElement('div');
          row.className = 'song-row';
          row.innerHTML = `
            <div class="song-thumb">${(song.title || 'S').slice(0, 1).toUpperCase()}</div>
            <div class="song-meta">
              <div class="song-title">${escapeHtml(song.title || 'Untitled')}</div>
              <div class="song-sub">${song.source || 'Local file'}</div>
            </div>
            <div class="play-chip" data-index="${index}" aria-label="Play track"></div>
          `;

          row.addEventListener('click', (event) => {
            const target = event.target.closest('.play-chip');
            if (target) {
              playAtIndex(Number(target.dataset.index));
            } else {
              playAtIndex(index);
            }
          });

          songListEl.appendChild(row);
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      async function handleFiles(event) {
        const files = [...(event.target.files || [])];
        if (!files.length) return;

        const newRecords = [];
        for (const file of files) {
          if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|flac|m4a|ogg|aac|opus)$/i)) {
            newRecords.push({
              id: crypto.randomUUID(),
              title: sanitizeFileName(file.name),
              blob: file,
              source: file.name,
              type: 'audio',
            });
          } else if (/\.zip$/i.test(file.name)) {
            try {
              const zipRecords = await extractZipAudio(file);
              newRecords.push(...zipRecords);
            } catch (error) {
              console.warn('ZIP import failed:', error);
            }
          }
        }

        if (!newRecords.length) {
          event.target.value = '';
          return;
        }

        await saveSongs(newRecords);
        await renderSongs();
        event.target.value = '';
        if (state.songs.length) {
          playAtIndex(0);
        }
      }

      function sanitizeFileName(name) {
        const cleaned = (name || 'Untitled').replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
        return cleaned || 'Untitled';
      }

      async function extractZipAudio(file) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const entries = [];
        const central = findCentralDirectory(bytes);
        if (!central) return [];

        const { cdOffset, cdSize } = central;
        let pos = cdOffset;
        const end = cdOffset + cdSize;

        while (pos < end) {
          if (bytes[pos] !== 0x50 || bytes[pos + 1] !== 0x4b || bytes[pos + 2] !== 0x01 || bytes[pos + 3] !== 0x02) break;

          const fileNameLen = (bytes[pos + 28] | (bytes[pos + 29] << 8));
          const extraLen = (bytes[pos + 30] | (bytes[pos + 31] << 8));
          const commentLen = (bytes[pos + 32] | (bytes[pos + 33] << 8));
          const compMethod = bytes[pos + 10] | (bytes[pos + 11] << 8);
          const dataOffset = bytes[pos + 42] | (bytes[pos + 43] << 8) | (bytes[pos + 44] << 16) | (bytes[pos + 45] << 24);
          const compressedSize = readU32LE(bytes, pos + 20);
          const fileName = bytes.slice(pos + 46, pos + 46 + fileNameLen);
          const fileNameString = new TextDecoder('utf-8').decode(fileName);
          const isValidAudio = /\.(mp3|wav|flac|m4a|ogg|aac|opus)$/i.test(fileNameString);

          if (isValidAudio && !fileNameString.includes('__MACOSX') && !fileNameString.includes('/._')) {
            const blob = await extractCompressedEntry(bytes, file, dataOffset, compMethod, compressedSize, fileNameString);
            entries.push({
              id: crypto.randomUUID(),
              title: sanitizeFileName(fileNameString),
              blob,
              source: file.name + ' / ' + fileNameString,
              type: 'audio',
            });
          }

          pos += 46 + fileNameLen + extraLen + commentLen;
        }

        return entries.sort((a, b) => a.title.localeCompare(b.title));
      }

      function findCentralDirectory(bytes) {
        const maxScan = Math.min(bytes.length, 65535 + 22);
        for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - maxScan); i--) {
          if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) {
            const cdSize = readU32LE(bytes, i + 12);
            const cdOffset = readU32LE(bytes, i + 16);
            return { cdSize, cdOffset };
          }
        }
        return null;
      }

      function readU32LE(bytes, offset) {
        return bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24);
      }

      async function extractCompressedEntry(bytes, zipFile, localOffset, compMethod, compressedSize, fileNameString) {
        const zipView = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const fileNameLen = zipView.getUint16(localOffset + 26, true);
        const extraLen = zipView.getUint16(localOffset + 28, true);
        const dataOffset = localOffset + 30 + fileNameLen + extraLen;
        const compressed = bytes.slice(dataOffset, dataOffset + compressedSize);

        if (compMethod === 0) {
          return new Blob([compressed], { type: inferMime(fileNameString) });
        }

        if (compMethod === 8) {
          const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate'));
          const inflated = await new Response(stream).arrayBuffer();
          return new Blob([new Uint8Array(inflated)], { type: inferMime(fileNameString) });
        }

        throw new Error('Unsupported ZIP compression method ' + compMethod);
      }

      function inferMime(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        const map = {
          mp3: 'audio/mpeg',
          wav: 'audio/wav',
          m4a: 'audio/mp4',
          flac: 'audio/flac',
          ogg: 'audio/ogg',
          aac: 'audio/aac',
          opus: 'audio/opus',
        };
        return map[ext] || 'audio/mpeg';
      }

      async function playAtIndex(index) {
        if (!state.songs.length) return;
        const song = state.songs[index];
        if (!song) return;
        state.currentIndex = index;
        const url = URL.createObjectURL(song.blob);
        if (audio.src && audio.src.startsWith('blob:')) URL.revokeObjectURL(audio.src);
        audio.src = url;
        audio.load();
        audio.play();
        updateCurrentMeta(song.title || 'Untitled');
      }

      function updateCurrentMeta(title) {
        playerTitle.textContent = title || 'Nothing playing';
        miniTrackText.textContent = title || 'Nothing playing';
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: title || 'Nothing playing',
            artist: 'Spotibai',
            album: 'Offline music',
          });
        }
      }

      function togglePlayback() {
        if (!state.songs.length) return;
        if (state.currentIndex === -1) {
          playAtIndex(0);
          return;
        }
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      }

      function prevTrack() {
        if (!state.songs.length) return;
        if (state.currentIndex <= 0) {
          if (state.songs.length > 0) playAtIndex(0);
          return;
        }
        playAtIndex(state.currentIndex - 1);
      }

      function nextTrack() {
        if (!state.songs.length) return;
        const next = state.currentIndex + 1 < state.songs.length ? state.currentIndex + 1 : 0;
        playAtIndex(next);
      }

      (async function init() {
        await renderSongs();
        syncPlayButtonState();
      })();
    </script>
  </body>
</html>
